name: automerge

on:
  pull_request:
    types: [labeled, ready_for_review, closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable:
    if: >
      github.event.action != 'closed' &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait for checks, then enable auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          # Do not let a pre-existing auto-merge setting merge while checks are
          # still running. It is enabled again only after all required jobs pass.
          gh pr merge --disable-auto "${PR_URL}" >/dev/null 2>&1 || true

          required='["lint","test","release-build","msrv","cross","audit","docker"]'
          checks_ready=false
          head_sha=""
          for _ in $(seq 1 80); do
            payload="$(gh pr view "${PR_URL}" --json state,headRefOid,statusCheckRollup)"
            state="$(jq -r '.state' <<<"${payload}")"
            head_sha="$(jq -r '.headRefOid' <<<"${payload}")"
            if [[ "${state}" == "MERGED" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/labels/automerge" >/dev/null 2>&1 || true
              echo "already merged; removed automerge label"
              exit 0
            fi
            if [[ "${state}" == "CLOSED" ]]; then
              echo "closed without merge; keeping the automerge label"
              exit 0
            fi

            statuses="$(jq -r --argjson required "${required}" '
              [(.statusCheckRollup // [])[] | {name:(.name // .context), status, conclusion, state}] as $checks |
              $required | map(
                . as $name |
                ($checks | map(select(.name == $name)) | first) as $check |
                if $check == null then "MISSING"
                elif (($check.conclusion // $check.state // $check.status) == "SUCCESS") then "SUCCESS"
                elif (($check.conclusion // $check.state // $check.status) | IN("FAILURE","CANCELLED","TIMED_OUT","ACTION_REQUIRED","STARTUP_FAILURE","SKIPPED")) then "FAILURE"
                else "PENDING" end
              ) | join(" ")
            ' <<<"${payload}")"
            echo "checks: ${statuses}"

            if grep -q 'FAILURE' <<<"${statuses}"; then
              echo "a required check failed; not enabling auto-merge" >&2
              exit 1
            fi
            if ! grep -qE 'MISSING|PENDING' <<<"${statuses}"; then
              checks_ready=true
              break
            fi
            sleep 15
          done

          if [[ "${checks_ready}" != "true" ]]; then
            echo "timed out waiting for validation checks" >&2
            exit 1
          fi

          enabled="$(gh pr view "${PR_URL}" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [[ "${enabled}" == "true" ]]; then
            echo "auto-merge is already enabled"
          else
            gh pr merge --auto --squash --match-head-commit "${head_sha}" "${PR_URL}"
          fi

          for _ in $(seq 1 80); do
            state="$(gh pr view "${PR_URL}" --json state --jq '.state')"
            case "${state}" in
              MERGED)
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/labels/automerge" >/dev/null 2>&1 || true
                echo "merged; removed automerge label"
                exit 0
                ;;
              CLOSED)
                echo "closed without merge; keeping the automerge label"
                exit 0
                ;;
            esac
            sleep 15
          done
          echo "timed out waiting for merge; the closed-event cleanup remains as fallback" >&2
          exit 1

  remove-label:
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.merged &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    steps:
      - name: Remove the automerge label after merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/labels/automerge" >/dev/null 2>&1 || true
          echo "removed automerge label"
