name: automerge

on:
  pull_request:
    types: [labeled, ready_for_review, closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable:
    if: >
      github.event.action != 'closed' &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Enable native auto-merge and wait for the merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          enabled="$(gh pr view "${PR_URL}" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [[ "${enabled}" == "true" ]]; then
            echo "auto-merge is already enabled"
          else
            gh pr merge --auto --squash "${PR_URL}"
          fi

          for _ in $(seq 1 120); do
            state="$(gh pr view "${PR_URL}" --json state --jq '.state')"
            case "${state}" in
              MERGED)
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/labels/automerge" >/dev/null 2>&1 || true
                echo "merged; removed automerge label"
                exit 0
                ;;
              CLOSED)
                echo "closed without merge; keeping the label"
                exit 0
                ;;
            esac
            sleep 15
          done
          echo "timed out waiting for merge; the closed-event cleanup remains as fallback"

  remove-label:
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.merged &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    steps:
      - name: Remove the automerge label after merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/labels/automerge" >/dev/null 2>&1 || true
          echo "removed automerge label"
