name: ci

# Pull-request validation, plus optional auto-merge when the PR carries the
# "automerge" label. Pushes to main are handled by warm-cache.yml; keeping
# those triggers separate avoids running validation twice per PR update.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: alps-v1
          shared-key: debug
          save-if: false
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: alps-v1
          shared-key: debug
          save-if: false
      - run: cargo test --all-features

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: alps-v1
          shared-key: release
          save-if: false
      - run: cargo build --release --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: alps-v1
          shared-key: msrv
          save-if: false
      - run: cargo build --locked

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: alps-v1
          shared-key: cross-release
          save-if: false
      - run: cross build --release --locked --target aarch64-unknown-linux-gnu

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: alps:ci
          cache-from: type=gha,scope=alps-docker
          cache-to: type=gha,mode=max,scope=alps-docker

  ci-success:
    if: ${{ always() }}
    needs: [lint, test, release-build, msrv, cross, audit, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to pass
        shell: bash
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: ${results}"
          case "${results}" in
            *failure*|*cancelled*|*skipped*) exit 1 ;;
          esac

  automerge:
    needs: [ci-success]
    if: >
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'automerge')
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          state="$(gh pr view "${PR_URL}" --json autoMergeRequest --jq '.autoMergeRequest')"
          if [[ "${state}" == "null" ]]; then
            gh pr merge --auto --squash "${PR_URL}"
          else
            echo "auto-merge is already enabled"
          fi
