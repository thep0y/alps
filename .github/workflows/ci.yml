name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Debug cache. Saved only when code lands on main, so PRs and feature
      # branches restore the warm cache instead of re-downloading crates.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: alps-v1
          shared-key: debug
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Release cache is separate from the debug cache; the release profile
      # uses thin LTO and codegen-units=1, so mixing profiles would thrash.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: alps-v1
          shared-key: release
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - run: cargo build --release --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: alps-v1
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - run: cargo build --locked

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: alps-v1
          shared-key: cross-release
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - run: cross build --release --locked --target aarch64-unknown-linux-gnu

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: alps:ci
          cache-from: type=gha,scope=alps-docker
          cache-to: type=gha,mode=max,scope=alps-docker
