name: cleanup-branches

# Delete a feature branch after its pull request is merged. The repository
# setting "Automatically delete head branches" usually does this first, so the
# immediate job treats an already-missing branch as success. The manual sweep
# is a fallback for branches left behind by older merges.
on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: List matching branches without deleting them
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-branches
  cancel-in-progress: false

jobs:
  delete-head-branch:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete the merged head branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! current="$(gh api "repos/${REPO}/git/ref/heads/${BRANCH}" --jq '.object.sha' 2>/dev/null)"; then
            echo "branch ${BRANCH} is already gone or cannot be read"
            exit 0
          fi
          if [[ "${current}" != "${HEAD_SHA}" ]]; then
            echo "branch ${BRANCH} moved after the PR head; refusing to delete it"
            exit 0
          fi
          gh api --method DELETE "repos/${REPO}/git/refs/heads/${BRANCH}"
          echo "deleted ${BRANCH}"

  sweep-merged-branches:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches belonging to merged PRs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          default_branch="$(gh repo view "${REPO}" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          open_heads="$(gh pr list --repo "${REPO}" --state open --limit 1000 --json headRefName --jq '.[].headRefName')"

          gh pr list --repo "${REPO}" --state merged --limit 1000 \
            --json number,headRefName,headRefOid,headRepository,headRepositoryOwner \
            --jq '.[] | [.number, .headRefName, .headRefOid, .headRepository.name, .headRepositoryOwner.login] | @tsv' |
          while IFS=$'\t' read -r number branch sha repository_name owner; do
            [[ -z "${branch}" ]] && continue
            if [[ "${owner}/${repository_name}" != "${REPO}" ]]; then
              continue
            fi
            if [[ "${branch}" == "${default_branch}" ]]; then
              continue
            fi
            if grep -Fxq "${branch}" <<< "${open_heads}"; then
              echo "skip PR #${number}: ${branch} has an open pull request"
              continue
            fi

            if ! current="$(gh api "repos/${REPO}/git/ref/heads/${branch}" --jq '.object.sha' 2>/dev/null)"; then
              continue
            fi
            if [[ "${current}" != "${sha}" ]]; then
              echo "skip PR #${number}: ${branch} moved since it was merged"
              continue
            fi
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "would delete PR #${number}: ${branch}"
            else
              gh api --method DELETE "repos/${REPO}/git/refs/heads/${branch}"
              echo "deleted PR #${number}: ${branch}"
            fi
          done
