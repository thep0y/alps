name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Target core version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      kind:
        description: Release type
        required: true
        type: choice
        options:
          - stable
          - alpha
          - beta
      dry_run:
        description: Bump, validate and build without committing, tagging or publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      prerelease: ${{ steps.bump.outputs.prerelease }}
      sha: ${{ steps.bump.outputs.sha }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore debug cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: alps-v1
          shared-key: debug
          save-if: false

      - name: Compute next version
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          VERSION="$(python3 scripts/bump_version.py \
            --bump "${{ inputs.bump }}" \
            --kind "${{ inputs.kind }}" \
            --write)"
          TAG="v${VERSION}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "tag ${TAG} already exists" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          if [[ "${{ inputs.kind }}" == "stable" ]]; then
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          else
            echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          fi
          echo "Next version: ${TAG}"

      - name: Validate bumped tree
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-features
          cargo test --all-features

  build-x86_64:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Restore cross cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: alps-v1
          shared-key: cross-release
          save-if: false

      - name: Apply the release version
        shell: bash
        run: |
          set -euo pipefail
          actual="$(python3 scripts/bump_version.py \
            --bump "${{ inputs.bump }}" \
            --kind "${{ inputs.kind }}" \
            --write)"
          test "${actual}" = "${VERSION}"
          echo "building ${TAG} on x86_64"

      - name: Build x86_64
        run: cross build --release --locked --target x86_64-unknown-linux-gnu

      - name: Check x86_64 glibc compatibility
        run: python3 scripts/check_glibc.py target/x86_64-unknown-linux-gnu/release/alps --max 2.18

      - name: Package x86_64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/alps-${TAG}-x86_64-unknown-linux-gnu.tar.gz" \
            -C target/x86_64-unknown-linux-gnu/release alps

      - name: Upload x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: alps-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error

  build-aarch64:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Restore cross cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: alps-v1
          shared-key: cross-release
          save-if: false

      - name: Apply the release version
        shell: bash
        run: |
          set -euo pipefail
          actual="$(python3 scripts/bump_version.py \
            --bump "${{ inputs.bump }}" \
            --kind "${{ inputs.kind }}" \
            --write)"
          test "${actual}" = "${VERSION}"
          echo "building ${TAG} on aarch64"

      - name: Build aarch64
        run: cross build --release --locked --target aarch64-unknown-linux-gnu

      - name: Check aarch64 glibc compatibility
        run: python3 scripts/check_glibc.py target/aarch64-unknown-linux-gnu/release/alps --max 2.18

      - name: Package aarch64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf "dist/alps-${TAG}-aarch64-unknown-linux-gnu.tar.gz" \
            -C target/aarch64-unknown-linux-gnu/release alps

      - name: Upload aarch64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: alps-aarch64
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [prepare, build-x86_64, build-aarch64]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: alps-*
          path: dist
          merge-multiple: true

      - name: Package checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          ls -l dist

      - name: Apply the release version
        shell: bash
        run: |
          set -euo pipefail
          actual="$(python3 scripts/bump_version.py \
            --bump "${{ inputs.bump }}" \
            --kind "${{ inputs.kind }}" \
            --write)"
          test "${actual}" = "${VERSION}"

      - name: Generate categorized release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          python3 scripts/release_notes.py --tag "${TAG}" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Commit version bump to main
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet; then
            echo "version bump produced no changes" >&2
            exit 1
          fi
          git commit -m "chore(release): ${TAG}"
          git push origin HEAD:main

      - name: Tag and publish GitHub release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git tag -a "${TAG}" -m "ALPS ${TAG}"
          git push origin "${TAG}"
          args=(--title "ALPS ${TAG}" --notes-file RELEASE_NOTES.md)
          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${TAG}" dist/* "${args[@]}"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: echo "Dry run complete for ${TAG}; no commit, tag or release was created."
