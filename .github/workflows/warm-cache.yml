name: warm-cache

# Post-merge cache warming is a separate concern from PR validation.
# This workflow is the only writer of the Cargo and Docker build caches; pull
# requests restore them read-only. Debug and release use separate shared keys
# because the release profile (thin LTO, codegen-units=1) produces
# incompatible artifacts.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warm-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: alps-v1
          shared-key: debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --all-features

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: alps-v1
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: alps-v1
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: alps-v1
          shared-key: cross-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cross build --release --locked --target aarch64-unknown-linux-gnu

  docker:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: alps:cache
          cache-from: type=gha,scope=alps-docker
          cache-to: type=gha,mode=max,scope=alps-docker
